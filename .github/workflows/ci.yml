name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: "pip install --only-binary :all: -r requirements-dev.txt"

      - name: Rodar o ruff
        run: ruff check .

  test:
    name: Test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependências
        run: "pip install --only-binary :all: -r requirements-dev.txt"

      - name: Rodar os testes
        run: python -m pytest -v --cov=. --cov-report=xml

      - name: Guardar relatório de cobertura
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Gerar arquivo de build
        run: |
          mkdir dist
          echo "Build gerado pelo commit ${{ github.sha }}" > dist/build-info.txt

      - name: Guardar artefato
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: dist/

  deploy:
    name: Deploy (simulado)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: producao-simulada

    concurrency:
      group: deploy-producao-simulada
      cancel-in-progress: false
      
    steps:
      - name: Baixar artefato do build
        uses: actions/download-artifact@v4
        with:
          name: build-info
          path: dist/

      - name: Simular deploy
        run: |
          echo "Publicando o conteúdo abaixo..."
          cat dist/build-info.txt

  sonar:
    name: Sonar
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Baixar relatório de cobertura
        uses: actions/download-artifact@v4
        with:
          name: coverage-xml

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - uses: SonarSource/sonarqube-auth-action@b372e2c2930aadfcc4f4399446da1e12772709ad # v1.2
        id: auth

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        with:
         args: >
            -Dsonar.organization=mariaeduardabrs
            -Dsonar.projectKey=MariaEduardaBrs_01-ai-operational-monitoring
            -Dsonar.python.coverage.reportPaths=coverage.xml

  matriz:
    name: Matriz de rotas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Regenerar a matriz
        run: python gerar_matriz.py

      - name: Conferir se a matriz commitada está atualizada
        run: git diff --exit-code MATRIZ_ROTAS.md
