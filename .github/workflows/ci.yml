name: CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checar sintaxe
        run: python -m compileall -q .

      - name: Instalar pytest
        run: pip install pytest

      - name: Rodar testes
        run: python -m pytest
